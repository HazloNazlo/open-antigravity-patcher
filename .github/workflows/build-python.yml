name: Build Python

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Отмена устаревших сборок при новых коммитах в ту же ветку,
# чтобы очередь не росла при частых пушах.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Windows: x64
  # PyInstaller runs natively; architecture param selects the Python interpreter bitness.
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python-arch: x64
            output: Open_AG_Patcher_Windows_x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python (${{ matrix.arch }})
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          architecture: ${{ matrix.python-arch }}

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: source

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile
          --uac-admin
          --icon=icon.ico
          --name="Open_AG_Patcher_Windows_x64"
          --noupx
          --clean
          --version-file=version.txt
          --hidden-import=packaging
          --hidden-import=packaging.version
          --hidden-import=packaging.specifiers
          --hidden-import=packaging.requirements
          main.py
        working-directory: source

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-windows-${{ matrix.arch }}
          path: source/dist/${{ matrix.output }}
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows ARM64 — native windows-11-arm runner
  # setup-python@v6 on ARM64 runners does not accept the 'architecture' param,
  # so this target runs as a dedicated job.
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows-arm64:
    name: Build Windows (arm64)
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: source

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile
          --uac-admin
          --icon=icon.ico
          --name="Open_AG_Patcher_Windows_arm64"
          --noupx
          --clean
          --version-file=version.txt
          --hidden-import=packaging
          --hidden-import=packaging.version
          --hidden-import=packaging.specifiers
          --hidden-import=packaging.requirements
          main.py
        working-directory: source

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-windows-arm64
          path: source/dist/Open_AG_Patcher_Windows_arm64.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux x64
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: source

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile
          --icon=icon.ico
          --name="Open_AG_Patcher_Linux_x64"
          --hidden-import=packaging
          --hidden-import=packaging.version
          --hidden-import=packaging.specifiers
          --hidden-import=packaging.requirements
          --clean
          main.py
        working-directory: source

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-linux-x64
          path: source/dist/Open_AG_Patcher_Linux_x64
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux ARM64 — native ubuntu-24.04-arm runner
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: source

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile
          --icon=icon.ico
          --name="Open_AG_Patcher_Linux_arm64"
          --hidden-import=packaging
          --hidden-import=packaging.version
          --hidden-import=packaging.specifiers
          --hidden-import=packaging.requirements
          --clean
          main.py
        working-directory: source

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-linux-arm64
          path: source/dist/Open_AG_Patcher_Linux_arm64
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS — universal2 binary (Intel + Apple Silicon in one file)
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (universal2)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python (universal2 / arm64 host)
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: source

      - name: Build with PyInstaller (universal2)
        run: >
          pyinstaller --onefile
          --name="Open_AG_Patcher_macOS"
          --target-arch universal2
          --hidden-import=packaging
          --hidden-import=packaging.version
          --hidden-import=packaging.specifiers
          --hidden-import=packaging.requirements
          --clean
          main.py
        working-directory: source

      # PyInstaller подписывает onefile ad-hoc, но после упаковки PKG-архива
      # подпись может оказаться неполной — macOS тогда убивает процесс
      # с "Code Signature Invalid". Переподписываем бинарник целиком.
      - name: Re-sign (ad-hoc) and verify
        run: |
          codesign --force --sign - --timestamp=none dist/Open_AG_Patcher_macOS
          codesign --verify --strict dist/Open_AG_Patcher_macOS
          lipo -archs dist/Open_AG_Patcher_macOS
        working-directory: source

      - name: Smoke test (headless)
        run: |
          # Бинарник без TTY печатает меню и ждёт ввода — скармливаем "0"
          # (выход), чтобы убедиться, что он стартует и не падает.
          set +e
          printf '0\n' | ./dist/Open_AG_Patcher_macOS > /tmp/ag_smoke.txt 2>&1
          echo "exit=$?"
          tail -20 /tmp/ag_smoke.txt
          test -s /tmp/ag_smoke.txt
        working-directory: source

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-macos-universal2
          path: source/dist/Open_AG_Patcher_macOS
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # GitHub Release — publish executables for Windows, Linux and macOS
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-macos
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec cp -v {} release_assets/ \;
          ls -lh release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
          name: "Open AG Patcher ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}"
          draft: false
          prerelease: false
          body: |
            ## Open AG Patcher v1.4.0

            Кроссплатформенный патчер региональных ограничений Google Antigravity (IDE 2.6.x, Manager 2.31.2, CLI agy, IDE backend agy).

            ### Файлы релиза:
            * **Windows (x64):** `Open_AG_Patcher_Windows_x64.exe`
            * **Windows (ARM64):** `Open_AG_Patcher_Windows_arm64.exe`
            * **Linux (x64):** `Open_AG_Patcher_Linux_x64`
            * **Linux (ARM64):** `Open_AG_Patcher_Linux_arm64`
            * **macOS (universal2 — Intel + Apple Silicon):** `Open_AG_Patcher_macOS`

            ### Ключевые возможности и изменения v1.4.0:
            * **Единый движок гейтов (`gates.py`):** байтовые сигнатуры, строгая идемпотентность, отказ от угадывания при неоднозначности.
            * **Antigravity IDE 2.6.x:** снятие тир-гейта `confirmUserForService` и онбординг `standard-tier` (с безопасным fallback на 2.5.x).
            * **Бэкенд Antigravity IDE (`agy --hub`):** выделенная поддержка `~/.gemini/bin/agy`.
            * **macOS App Management:** безопасная модификация через staging + swap бандлов.
            * **macOS переподпись:** ad-hoc подпись «изнутри наружу» с сохранением entitlements (`allow-jit`, `disable-library-validation`).
            * **Откат прокси:** автоматический возврат `AG_LS_PROXY` → `https_proxy`.
          files: release_assets/*
